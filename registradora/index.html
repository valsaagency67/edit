<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: usa toda la pantalla del iPhone (zona de la muesca incluida) -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Registradora</title>
    <meta name="description" content="Registra lo que entra y sale, en segundos. Tus datos se quedan en tu celular." />

    <!-- Colores de la barra del sistema en tema claro y oscuro -->
    <meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121412" media="(prefers-color-scheme: dark)" />

    <!-- Instalación en Android (Chrome) -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./iconos/icono.svg" type="image/svg+xml" />

    <!-- Instalación en iPhone (Safari → Compartir → Agregar a inicio) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Registradora" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="./iconos/apple-touch-icon.png" />
  </head>
  <body>
    <div id="app"></div>
    <noscript>Registradora necesita JavaScript activado.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
